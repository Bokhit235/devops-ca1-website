apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-ca1-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-ca1-website
  template:
    metadata:
      labels:
        app: devops-ca1-website
    spec:
      containers:
        - name: devops-ca1-website
          image: docker.io/library/devops-ca1-website:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5001
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10